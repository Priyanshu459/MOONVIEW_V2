# Moonview Production Nginx Config
# Domain: replace DOMAIN_NAME with your domain (e.g. moonview.bodhisync.online)
# Requires: Let's Encrypt cert at /etc/letsencrypt/live/DOMAIN_NAME/

# HTTP → HTTPS redirect + Certbot ACME challenge
server {
    listen 80;
    server_name DOMAIN_NAME;

    # Allow Certbot ACME challenge for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://DOMAIN_NAME$request_uri;
    }
}

# HTTPS reverse proxy for Jellyfin/Moonview
server {
    listen 443 ssl;
    server_name DOMAIN_NAME;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;

    # Modern SSL — TLSv1.2 + TLSv1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # HSTS — 2 year max-age, A+ SSL grade
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Allow large uploads (metadata, subtitles, etc.)
    client_max_body_size 100M;

    # Jellyfin reverse proxy
    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host DOMAIN_NAME;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol https;
        proxy_set_header X-Forwarded-Host DOMAIN_NAME;

        # Disable buffering for large media streams
        proxy_buffering off;
        proxy_request_buffering off;

        # Support HTTP range requests (needed for Direct Play seeking)
        proxy_force_ranges on;

        # WebSocket support (needed for Jellyfin real-time features)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;

        # Long timeout for media sessions
        proxy_read_timeout 36000s;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
